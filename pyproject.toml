[project]
name = "qmlease"
version = "4.0.0a15"
description = "A flexible toolkit for Python programmer to efficiently develop QML graphical user interface."
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argsense>=1.1.2",
    "jurigged>=0.6.1",
    "lk-utils>=3.8.0a5",
    "materialyoucolor>=3.0.2",
    "neoprint>=0.1.10a0",
    "qmlease-colorsys>=0.1.0a10",
    "qtpy>=2.4.3",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "faker>=40.8.0",
    "parsel>=1.10.0; python_version >= '3.12'",
    "pyside6>=6.11.0; python_version >= '3.12' and python_version < '3.15'",
]

[project.optional-dependencies]
gui = [
    "pyside6>=6.11.0; python_version >= '3.12' and python_version < '3.15'",
    # "pyside6>=6.4.3,<6.5.0; python_version >= '3.10' and python_version < '3.12'",
]

[project.urls]
homepage = "https://github.com/likianta/qmlease"

[tool.hatch.build.targets.wheel]
packages = ["qmlease"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# [tool.ty.environment]
# extra-paths = ["./lib"]

# [tool.ty.rules]
# invalid-type-form = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2191/"
explicit = true

[tool.uv.sources]
# argsense = { index = "likianta" }
lk-utils = { index = "likianta" }
neoprint = { index = "likianta" }
qmlease-colorsys = { index = "likianta" }
